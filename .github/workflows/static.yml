<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macroeconomics for Law Graduates</title>
            <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        .presentation-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            padding: 20px;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            animation: slideIn 0.6s ease-in-out;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .slide.active {
            display: flex;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        h1 {
            font-size: clamp(2em, 8vw, 3.5em);
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            line-height: 1.2;
        }

        h2 {
            font-size: clamp(1.5em, 6vw, 2.8em);
            margin-bottom: 20px;
            text-align: center;
            color: #ffd700;
            line-height: 1.3;
        }

        h3 {
            font-size: clamp(1.2em, 4vw, 2.2em);
            margin-bottom: 15px;
            color: #87ceeb;
            line-height: 1.3;
        }

        .subtitle {
            font-size: clamp(1em, 3vw, 1.5em);
            margin-bottom: 20px;
            text-align: center;
            opacity: 0.9;
            line-height: 1.4;
        }

        .content {
            max-width: min(1200px, 100%);
            width: 100%;
            text-align: left;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for navigation */
        }

        .bullet-point {
            font-size: clamp(0.9em, 3vw, 1.3em);
            margin-bottom: 12px;
            padding-left: 25px;
            position: relative;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .bullet-point:before {
            content: "▶";
            position: absolute;
            left: 0;
            color: #ffd700;
            font-weight: bold;
            font-size: 0.8em;
        }

        .highlight {
            background: rgba(255, 215, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            color: #ffd700;
            font-weight: bold;
            word-break: break-word;
        }

        .circular-flow {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            position: relative;
            margin: 15px 0;
            gap: 20px;
        }

        .flow-element {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 15px;
            margin: 10px;
            text-align: center;
            font-weight: bold;
            font-size: clamp(0.8em, 3vw, 1.2em);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            min-width: 200px;
            max-width: 90%;
        }

        .flow-element:active {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(1.02);
        }

        .households {
            background: rgba(135, 206, 235, 0.3);
            border-color: #87ceeb;
        }

        .firms {
            background: rgba(255, 192, 203, 0.3);
            border-color: #ffb6c1;
        }

        .government {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
        }

        .arrow {
            position: relative;
            color: #ffd700;
            font-size: 1.5em;
            font-weight: bold;
            animation: pulse 2s infinite;
            margin: 5px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .navigation {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
            width: 90%;
            max-width: 300px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #ffd700;
            color: white;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: clamp(0.8em, 3vw, 1em);
            font-weight: bold;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active {
            background: rgba(255, 215, 0, 0.3);
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .slide-counter {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            font-size: clamp(0.8em, 3vw, 1em);
            z-index: 1000;
        }

        .case-study {
            background: rgba(255, 165, 0, 0.1);
            border-left: 4px solid #ffa500;
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
        }

        .definition-box {
            background: rgba(135, 206, 235, 0.1);
            border: 2px solid #87ceeb;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: center;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .comparison-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            backdrop-filter: blur(10px);
        }

        .workshop-activity {
            background: rgba(255, 69, 0, 0.1);
            border: 2px solid #ff4500;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
        }

        .key-takeaways {
            background: rgba(50, 205, 50, 0.1);
            border: 2px solid #32cd32;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
        }

        .interactive-element {
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed #ffd700;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .interactive-element:active {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(0.98);
        }

        .flow-diagram {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 20px 0;
            gap: 15px;
        }

        .flow-step {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #87ceeb;
            border-radius: 50%;
            width: clamp(80px, 20vw, 120px);
            height: clamp(80px, 20vw, 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(0.7em, 2.5vw, 0.9em);
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .flow-step:active {
            background: rgba(135, 206, 235, 0.3);
            transform: scale(1.05);
        }

        /* Tablet and larger screens */
        @media (min-width: 768px) {
            .slide {
                padding: 40px;
                justify-content: center;
            }

            .comparison-grid {
                grid-template-columns: 1fr 1fr;
            }

            .circular-flow {
                flex-direction: row;
                height: 400px;
            }

            .flow-element {
                position: relative;
                margin: 20px;
            }

            .arrow {
                position: absolute;
                font-size: 2em;
            }

            .nav-btn:hover {
                background: rgba(255, 215, 0, 0.3);
                transform: translateY(-2px);
            }

            .interactive-element:hover {
                background: rgba(255, 215, 0, 0.2);
                transform: scale(1.02);
            }

            .flow-step:hover {
                background: rgba(135, 206, 235, 0.3);
                transform: rotate(5deg) scale(1.1);
            }

            .flow-element:hover {
                background: rgba(255, 215, 0, 0.2);
                transform: scale(1.05);
            }
        }

        /* Desktop and larger screens */
        @media (min-width: 1024px) {
            .slide {
                padding: 60px;
            }

            .content {
                padding-bottom: 40px;
            }

            .navigation {
                bottom: 30px;
                gap: 15px;
            }

            .nav-btn {
                padding: 12px 24px;
            }

            .slide-counter {
                top: 30px;
                right: 30px;
                padding: 10px 20px;
            }
        }

        /* Landscape mobile optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            .slide {
                padding: 10px;
                justify-content: flex-start;
            }

            h1 {
                font-size: 2em;
                margin-bottom: 10px;
            }

            h2 {
                font-size: 1.5em;
                margin-bottom: 10px;
            }

            .content {
                padding-bottom: 60px;
            }

            .bullet-point {
                margin-bottom: 8px;
            }

            .flow-element, .comparison-item, .case-study, .definition-box {
                padding: 10px;
                margin: 8px 0;
            }
        }
    </style>
</head>
<body>
    <div class="presentation-container">
        <div class="slide-counter">
            <span id="slideNumber">1</span> / <span id="totalSlides">12</span>
        </div>

        <!-- Slide 1: Title -->
        <div class="slide active">
            <h1>MACROECONOMICS</h1>
            <div class="subtitle">The Legal Blueprint of Our Economy</div>
            <div class="subtitle">Economics-III | Module I</div>
            <div class="definition-box">
                <h3>For Law Graduates</h3>
                <p style="font-size: 1.2em; margin-top: 15px;">Understanding the intersection of law, policy, and economic systems</p>
            </div>
        </div>

        <!-- Slide 2: What is Macroeconomics? -->
        <div class="slide">
            <h2>What is Macroeconomics?</h2>
            <div class="content">
                <div class="definition-box">
                    <h3>Definition</h3>
                    <p style="font-size: 1.3em;">"The study of the economy <span class="highlight">as a whole</span> - focusing on aggregate variables rather than individual markets"</p>
                </div>
                <div class="comparison-grid">
                    <div class="comparison-item">
                        <h3 style="color: #ffb6c1;">🌳 Microeconomics</h3>
                        <div class="bullet-point">Individual trees</div>
                        <div class="bullet-point">One firm's pricing</div>
                        <div class="bullet-point">A consumer's choice</div>
                    </div>
                    <div class="comparison-item">
                        <h3 style="color: #87ceeb;">🌲 Macroeconomics</h3>
                        <div class="bullet-point">The entire forest</div>
                        <div class="bullet-point">Nation's total output</div>
                        <div class="bullet-point">Overall price levels</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 3: The Big Questions -->
        <div class="slide">
            <h2>The "Big Questions" of Macroeconomics</h2>
            <div class="content">
                <div class="bullet-point">What determines a nation's <span class="highlight">total output and income (GDP)</span>?</div>
                <div class="bullet-point">What causes <span class="highlight">unemployment</span>, and what can be done about it?</div>
                <div class="bullet-point">What causes the general level of prices to rise <span class="highlight">(inflation)</span>?</div>
                <div class="bullet-point">How does <span class="highlight">government policy</span> (fiscal and monetary) affect the overall economy?</div>
                <div class="bullet-point">How do <span class="highlight">international trade and finance</span> impact a nation's economic stability?</div>
                
                <div class="case-study" style="margin-top: 40px;">
                    <h3>💡 Why Should Lawyers Care?</h3>
                    <p style="font-size: 1.2em;">Every major macroeconomic issue is <span class="highlight">governed, managed, or influenced by a legal framework</span></p>
                </div>
            </div>
        </div>

        <!-- Slide 4: Law-Macroeconomics Connection -->
        <div class="slide">
            <h2>The Law-Macroeconomics Connection</h2>
            <div class="content">
                <h3>📜 Legislation as Economic Tools</h3>
                
                <div class="comparison-grid">
                    <div class="comparison-item">
                        <h3 style="color: #ffd700;">Fiscal Policy</h3>
                        <div class="bullet-point">Union Budget → Appropriation Act</div>
                        <div class="bullet-point">FRBM Act, 2003</div>
                        <div class="bullet-point">Government spending & taxation</div>
                    </div>
                    <div class="comparison-item">
                        <h3 style="color: #87ceeb;">Monetary Policy</h3>
                        <div class="bullet-point">RBI Act, 1934</div>
                        <div class="bullet-point">Monetary Policy Committee</div>
                        <div class="bullet-point">Interest rates & inflation control</div>
                    </div>
                </div>

                <div class="case-study">
                    <h3>🏛️ Legal Framework Examples</h3>
                    <div class="bullet-point">Banking Regulation Act, 1949</div>
                    <div class="bullet-point">FEMA, 1999 (Foreign Exchange)</div>
                    <div class="bullet-point">Competition Act, 2002</div>
                </div>
            </div>
        </div>

        <!-- Slide 5: Why Lawyers Need This -->
        <div class="slide">
            <h2>Why Understanding Macroeconomics Matters for Lawyers</h2>
            <div class="content">
                <div class="flow-diagram">
                    <div class="flow-step">
                        <div>👥<br>Advise Clients</div>
                    </div>
                    <div class="flow-step">
                        <div>⚖️<br>Litigate Policy</div>
                    </div>
                    <div class="flow-step">
                        <div>📝<br>Draft Better Laws</div>
                    </div>
                </div>

                <div class="bullet-point"><span class="highlight">Corporate Lawyers:</span> Understand business environment shaped by interest rates, growth prospects, inflation</div>
                <div class="bullet-point"><span class="highlight">Public Interest:</span> Challenge economic and social consequences of government policies</div>
                <div class="bullet-point"><span class="highlight">Legislators:</span> Anticipate macroeconomic "ripple effects" of new laws</div>

                <div class="interactive-element" onclick="showExample()">
                    <strong>🎯 Click for Real Example: COVID-19 Stimulus</strong>
                    <div id="covidExample" style="display: none; margin-top: 15px; text-align: left;">
                        <p>Massive stimulus packages were <span class="highlight">legally authorized</span> deficit creation to counter economic collapse → Long-term consequence: Current inflation challenges</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 6: Static vs Dynamic Analysis -->
        <div class="slide">
            <h2>Analytical Tools: Static vs Dynamic</h2>
            <div class="content">
                <div class="comparison-grid">
                    <div class="comparison-item">
                        <h3 style="color: #87ceeb;">📸 Static Analysis</h3>
                        <div class="bullet-point">The "Snapshot" View</div>
                        <div class="bullet-point">Economy at single point in time</div>
                        <div class="bullet-point">Assumes other variables constant</div>
                        <div class="bullet-point"><strong>Legal Analogy:</strong> Impact assessment of new law</div>
                    </div>
                    <div class="comparison-item">
                        <h3 style="color: #ffd700;">🎬 Dynamic Analysis</h3>
                        <div class="bullet-point">The "Movie" View</div>
                        <div class="bullet-point">Path of change over time</div>
                        <div class="bullet-point">Incorporates time lags & adjustments</div>
                        <div class="bullet-point"><strong>Legal Analogy:</strong> Longitudinal study of consequences</div>
                    </div>
                </div>

                <div class="case-study">
                    <h3>Example: New 5% GST on Previously Exempt Product</h3>
                    <div class="bullet-point"><strong>Static:</strong> Immediate revenue increase, immediate price rise</div>
                    <div class="bullet-point"><strong>Dynamic:</strong> Consumer behavior over 2 years, producer response, employment impact</div>
                </div>
            </div>
        </div>

        <!-- Slide 7: Critical Thinking Prompt -->
        <div class="slide">
            <h2>🤔 Critical Thinking Challenge</h2>
            <div class="content">
                <div class="workshop-activity">
                    <h3>Question for Discussion:</h3>
                    <p style="font-size: 1.4em; margin: 20px 0; text-align: center; line-height: 1.6;">
                        "Most legislative debates focus on <span class="highlight">static impacts</span> (e.g., immediate cost to the exchequer). 
                        <br><br>
                        Why do you think the more complex, <span class="highlight">dynamic 'ripple effects'</span> are often ignored in policy-making? 
                        <br><br>
                        What are the <span class="highlight">risks</span> of such an approach?"
                    </p>
                </div>

                <div class="interactive-element" onclick="showRisks()">
                    <strong>💭 Click to Reveal Key Risks</strong>
                    <div id="risksContent" style="display: none; margin-top: 15px; text-align: left;">
                        <div class="bullet-point">Unintended long-term consequences</div>
                        <div class="bullet-point">Policy reversals and legal challenges</div>
                        <div class="bullet-point">Economic instability from short-term thinking</div>
                        <div class="bullet-point">Loss of public trust in institutions</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 8: Circular Flow Introduction -->
        <div class="slide">
            <h2>The Circular Flow of Income</h2>
            <div class="content">
                <div class="definition-box">
                    <h3>🔄 Anatomy of the Economy</h3>
                    <p style="font-size: 1.2em;">A simplified but powerful model for visualizing how the economy works and how legal interventions affect it</p>
                </div>

                <div class="circular-flow">
                    <div class="flow-element households">
                        <div>🏠<br><strong>HOUSEHOLDS</strong><br>Provide: Labour, Land, Capital<br>Receive: Wages, Rent, Profit</div>
                    </div>
                    <div class="arrow" style="top: 40%; left: 35%;">→</div>
                    <div class="flow-element firms">
                        <div>🏭<br><strong>FIRMS</strong><br>Produce: Goods & Services<br>Pay: Income to Households</div>
                    </div>
                    <div class="arrow" style="top: 60%; right: 35%;">←</div>
                </div>

                <div class="case-study">
                    <h3>💡 Key Insight</h3>
                    <p style="font-size: 1.2em; text-align: center;">In this basic model: <span class="highlight">Income = Expenditure</span><br>Money flows in a continuous circle</p>
                </div>
            </div>
        </div>

        <!-- Slide 9: Government in Circular Flow -->
        <div class="slide">
            <h2>Adding Government: Legal Intervention</h2>
            <div class="content">
                <div class="circular-flow" style="height: 400px;">
                    <div class="flow-element households" style="position: absolute; left: 100px; top: 50px;">
                        <div>🏠<br><strong>HOUSEHOLDS</strong></div>
                    </div>
                    <div class="flow-element firms" style="position: absolute; right: 100px; top: 50px;">
                        <div>🏭<br><strong>FIRMS</strong></div>
                    </div>
                    <div class="flow-element government" style="position: absolute; left: 50%; top: 200px; transform: translateX(-50%);">
                        <div>🏛️<br><strong>GOVERNMENT</strong></div>
                    </div>
                    <div class="arrow" style="top: 130px; left: 35%;">💸 TAXES</div>
                    <div class="arrow" style="top: 160px; right: 35%;">💰 SPENDING</div>
                </div>

                <div class="comparison-grid">
                    <div class="comparison-item" style="border-color: #ff6b6b;">
                        <h3 style="color: #ff6b6b;">📤 Withdrawals (Leakages)</h3>
                        <div class="bullet-point">Direct Taxes (Income, Corporate)</div>
                        <div class="bullet-point">Indirect Taxes (GST)</div>
                        <div class="bullet-point">Money leaves the circular flow</div>
                    </div>
                    <div class="comparison-item" style="border-color: #32cd32;">
                        <h3 style="color: #32cd32;">📥 Injections</h3>
                        <div class="bullet-point">Government Purchases</div>
                        <div class="bullet-point">Transfer Payments (Pensions, Subsidies)</div>
                        <div class="bullet-point">Money enters the circular flow</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 10: Budget Policy -->
        <div class="slide">
            <h2>Budgetary Policy and the Law</h2>
            <div class="content">
                <div class="flow-diagram">
                    <div class="flow-step" style="background: rgba(135, 206, 235, 0.3); border-color: #87ceeb;">
                        <div>⚖️<br>Balanced Budget<br><small>Spending = Taxes</small></div>
                    </div>
                    <div class="flow-step" style="background: rgba(255, 69, 0, 0.3); border-color: #ff4500;">
                        <div>📈<br>Budget Deficit<br><small>Spending > Taxes</small></div>
                    </div>
                    <div class="flow-step" style="background: rgba(50, 205, 50, 0.3); border-color: #32cd32;">
                        <div>📉<br>Budget Surplus<br><small>Spending < Taxes</small></div>
                    </div>
                </div>

                <div class="case-study">
                    <h3>🦠 COVID-19 Case Study</h3>
                    <div class="bullet-point">Economy ground to halt → Circular flow broken</div>
                    <div class="bullet-point">Government response: <span class="highlight">Massive stimulus packages</span></div>
                    <div class="bullet-point">Legal framework: <span class="highlight">Authorized large budget deficit</span></div>
                    <div class="bullet-point">Dynamic consequence: <span class="highlight">Current inflation challenges</span></div>
                </div>

                <div class="interactive-element" onclick="showFRBM()">
                    <strong>📊 FRBM Act Constraints</strong>
                    <div id="frbmContent" style="display: none; margin-top: 15px; text-align: left;">
                        <p>Fiscal Responsibility and Budget Management Act, 2003 sets legal limits on government deficit spending</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 11: Workshop Activity -->
        <div class="slide">
            <h2>🚗 Workshop: Green Energy Subsidy Challenge</h2>
            <div class="content">
                <div class="workshop-activity">
                    <h3>Scenario</h3>
                    <p style="font-size: 1.2em; margin-bottom: 20px;">You are legal advisors to the Parliamentary Committee on Environment. A bill proposes:</p>
                    <div class="bullet-point">₹1 lakh crore subsidy for EV manufacturers and consumers</div>
                    <div class="bullet-point">Funded by 5% 'carbon tax' on petrol/diesel cars</div>
                </div>

                <div class="comparison-grid">
                    <div class="comparison-item">
                        <h3>📋 Your Tasks</h3>
                        <div class="bullet-point">Map the withdrawals (carbon tax)</div>
                        <div class="bullet-point">Map the injections (subsidies)</div>
                        <div class="bullet-point">Analyze macroeconomic effects</div>
                        <div class="bullet-point">Identify legal challenges</div>
                    </div>
                    <div class="comparison-item">
                        <h3>🎯 Consider</h3>
                        <div class="bullet-point">Inflation impact</div>
                        <div class="bullet-point">Employment effects</div>
                        <div class="bullet-point">Consumer behavior changes</div>
                        <div class="bullet-point">WTO compliance issues</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 12: Key Takeaways -->
        <div class="slide">
            <h2>🎯 Key Takeaways for Law Professionals</h2>
            <div class="content">
                <div class="key-takeaways">
                    <div class="bullet-point"><span class="highlight">Law is an Economic Instrument:</span> Legal frameworks are the primary tools governments use to manage economies</div>
                    
                    <div class="bullet-point"><span class="highlight">Think in Aggregates:</span> Your legal work will have effects that ripple out into the wider economy</div>
                    
                    <div class="bullet-point"><span class="highlight">Models are Tools, Not Reality:</span> The Circular Flow helps ask the right questions about first-order effects</div>
                    
                    <div class="bullet-point"><span class="highlight">Every Policy has a Cost:</span> Macroeconomics reveals trade-offs inherent in every legal decision</div>
                </div>

                <div class="definition-box" style="margin-top: 30px;">
                    <h3>Your Role as Economic Architects</h3>
                    <p style="font-size: 1.3em;">As lawyers, you are not passive observers of the economy - you are its architects. Understanding macroeconomics is a core competency for engaging with public policy challenges.</p>
                </div>

                <div style="text-align: center; font-size: 2em; margin-top: 30px;">
                    Thank you! Questions? 🤔
                </div>
            </div>
        </div>

        <div class="navigation">
            <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">← Previous</button>
            <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">Next →</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;

        document.getElementById('totalSlides').textContent = totalSlides;

        function showSlide(n) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (n + totalSlides) % totalSlides;
            slides[currentSlide].classList.add('active');
            document.getElementById('slideNumber').textContent = currentSlide + 1;
            
            // Update navigation buttons
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
        }

        function changeSlide(direction) {
            if (direction === 1 && currentSlide < totalSlides - 1) {
                showSlide(currentSlide + 1);
            } else if (direction === -1 && currentSlide > 0) {
                showSlide(currentSlide - 1);
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                changeSlide(1);
            } else if (e.key === 'ArrowLeft') {
                changeSlide(-1);
            }
        });

        // Interactive elements
        function showExample() {
            const element = document.getElementById('covidExample');
            element.style.display = element.style.display === 'none' ? 'block' : 'none';
        }

        function showRisks() {
            const element = document.getElementById('risksContent');
            element.style.display = element.style.display === 'none' ? 'block' : 'none';
        }

        function showFRBM() {
            const element = document.getElementById('frbmContent');
            element.style.display = element.style.display === 'none' ? 'block' : 'none';
        }

        // Initialize
        showSlide(0);
    </script>
</body>
</html>
